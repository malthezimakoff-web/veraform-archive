<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veraform research archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='1' fill='%23c9a24b'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14120f; --panel: #1c1915; --panel2: #100e0b; --line: #2e2a22; --line2: #241f18;
    --text: #e8e1d3; --muted: #a89c85; --dim: #6b5f4c;
    --accent: #c9a24b; --accent-dim: #8a7038;
    --ok: #5fae72; --bad: #d16a5a; --warn: #c9a24b;
    --serif: ui-serif, Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f6f1e6; --panel: #fffdf8; --panel2: #ede6d4; --line: #ddd2b6; --line2: #e6dcc3;
    --text: #241f18; --muted: #6b5f4c; --dim: #948763;
    --accent: #96731f; --accent-dim: #c9a24b;
    --ok: #2f7a45; --bad: #a83f2a; --warn: #96731f;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f1e6; --panel: #fffdf8; --panel2: #ede6d4; --line: #ddd2b6; --line2: #e6dcc3;
      --text: #241f18; --muted: #6b5f4c; --dim: #948763;
      --accent: #96731f; --accent-dim: #c9a24b;
      --ok: #2f7a45; --bad: #a83f2a; --warn: #96731f;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans);
    display: flex; flex-direction: column;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  ::selection { background: var(--accent); color: var(--panel2); }

  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); flex-shrink: 0; background: var(--panel);
  }
  header h1 {
    font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: .2px;
    white-space: nowrap;
  }
  header h1 em { font-style: normal; color: var(--accent); }
  .searchbar {
    flex: 1; max-width: 520px; position: relative;
  }
  .searchbar input {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 5px; padding: 8px 12px 8px 30px; font: 13.5px var(--sans);
  }
  .searchbar input:focus { outline: none; border-color: var(--accent-dim); }
  .searchbar svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: .5; }
  .totals { margin-left: auto; display: flex; gap: 18px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .totals b { color: var(--text); font-weight: 600; }
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 6px 14px; border-radius: 5px; font-size: 13px; color: var(--muted); cursor: pointer;
    border: 1px solid transparent; user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--panel2); color: var(--accent); border-color: var(--line); font-weight: 600; }

  main { flex: 1; min-height: 0; display: flex; }
  .view { flex: 1; min-width: 0; min-height: 0; display: none; }
  .view.active { display: flex; }

  /* ---- entities view ---- */
  #view-entities { }
  .facets {
    width: 210px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 16px 14px;
    overflow-y: auto; background: var(--panel);
  }
  .facets h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 8px; }
  .facets h3 + h3 { margin-top: 18px; }
  .flist { display: flex; flex-direction: column; gap: 1px; }
  .fitem {
    display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 4px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .fitem:hover { background: var(--panel2); color: var(--text); }
  .fitem.active { background: var(--panel2); color: var(--accent); font-weight: 600; }
  .fitem .n { font-family: var(--mono); color: var(--dim); font-size: 11px; }
  .fitem.active .n { color: var(--accent-dim); }

  .elist { width: 340px; flex-shrink: 0; border-right: 1px solid var(--line); overflow-y: auto; }
  .erow {
    padding: 11px 16px; border-bottom: 1px solid var(--line2); cursor: pointer;
  }
  .erow:hover { background: var(--panel); }
  .erow.active { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 13px; }
  .erow .nm { font-family: var(--serif); font-size: 14.5px; font-weight: 600; }
  .erow .meta { display: flex; gap: 8px; align-items: center; margin-top: 3px; font-size: 11px; color: var(--dim); }
  .erow .sum { font-size: 12px; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px;
    border: 1px solid var(--line); color: var(--muted); font-family: var(--mono); white-space: nowrap;
  }
  .badge.type-organization { color: var(--accent); border-color: var(--accent-dim); }
  .badge.stub { color: var(--warn); border-color: var(--warn); opacity: .8; }

  .detail { flex: 1; overflow-y: auto; padding: 28px 36px; min-width: 0; }
  .detail-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); font-family: var(--serif); font-size: 15px; }
  .dhead { margin-bottom: 22px; }
  .dhead .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .dhead h2 { font-family: var(--serif); font-size: 28px; font-weight: 600; text-wrap: balance; line-height: 1.2; }
  .dhead .aliases { font-size: 12.5px; color: var(--dim); margin-top: 4px; font-style: italic; }
  .dhead .summary { margin-top: 12px; font-size: 14.5px; color: var(--muted); max-width: 65ch; line-height: 1.6; }
  .dhead .idline { margin-top: 10px; font-family: var(--mono); font-size: 11px; color: var(--dim); }

  .dsection { margin-top: 30px; }
  .dsection h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

  .citation {
    padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 10px; border-left: 3px solid var(--line);
  }
  .citation.invalid { opacity: .55; border-left-color: var(--dim); }
  .citation.high { border-left-color: var(--accent); }
  .citation .claim { font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
  .citation .claim .val { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .citation .quote {
    font-family: var(--serif); font-style: italic; font-size: 13px; color: var(--muted);
    padding-left: 12px; border-left: 2px solid var(--line); margin: 8px 0;
  }
  .citation .footline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: var(--dim); }
  .citation .footline a { color: var(--accent-dim); text-decoration: none; }
  .citation .footline a:hover { text-decoration: underline; color: var(--accent); }
  .citation .footline .sep { color: var(--line); }
  .chip { font-family: var(--mono); font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); }
  .chip.invalidated { color: var(--bad); border-color: var(--bad); }
  .chip.stale { color: var(--warn); border-color: var(--warn); }

  .edgelist { display: flex; flex-direction: column; gap: 6px; }
  .edgerow { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .edgerow:hover { border-color: var(--accent-dim); }
  .edgerow .rel { font-family: var(--mono); color: var(--accent-dim); font-size: 11.5px; }
  .edgerow .tgt { font-family: var(--serif); font-weight: 600; }
  .edgerow .dir { color: var(--dim); font-size: 11px; }

  /* ---- evidence view ---- */
  #view-evidence { flex-direction: column; }
  .ev-toolbar { display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ev-toolbar select { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 5px 8px; font-size: 12.5px; }
  .ev-toolbar label { font-size: 11.5px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
  .evlist { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 900px; }
  .evlist .citation .src-entity { font-family: var(--mono); font-size: 10.5px; color: var(--dim); margin-bottom: 6px; }

  /* ---- questions view ---- */
  /* Block-layout views: the display override must only apply when active,
     otherwise the ID selector beats .view{display:none} and the hidden view
     still occupies flex space as a phantom column. */
  #view-questions.active, #view-patterns.active { display: block; }
  #view-questions { padding: 24px 32px; overflow-y: auto; max-width: 980px; }
  .qcard { display: flex; gap: 16px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line2); }
  .qcard .qn { font-family: var(--serif); font-size: 20px; color: var(--dim); min-width: 42px; }
  .qcard .qbody { flex: 1; }
  .qcard .qtext { font-size: 14px; margin-bottom: 6px; }
  .qcard .qbar-row { display: flex; align-items: center; gap: 10px; }
  .qcard .qbar { flex: 1; max-width: 220px; height: 6px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
  .qcard .qbar i { display: block; height: 100%; background: var(--accent); }
  .qcard .qcov { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* ---- cockpit ---- */
  #view-cockpit.active { display: block; }
  #view-cockpit { overflow-y: auto; padding: 20px 24px 60px; }
  .ck-band { margin-bottom: 26px; max-width: 1100px; }
  .ck-band > h2 { font-family: var(--serif); font-size: 17px; font-weight: 650; margin-bottom: 10px; }
  .ck-band > h2 .n { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 8px; }
  .ck-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    border-left: 3px solid var(--line); padding: 11px 14px; margin-bottom: 8px; }
  .ck-card.u3 { border-left-color: var(--bad); }
  .ck-card.u2 { border-left-color: var(--accent); }
  .ck-card .row1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .ck-card .kind { font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
  .ck-card .lbl { font-size: 13px; font-weight: 600; flex: 1; min-width: 200px; }
  .ck-card .det { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.45; }
  .ck-cmd { display: flex; gap: 8px; align-items: center; margin-top: 7px; }
  .ck-cmd code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 10.5px; color: var(--accent-dim);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ck-cmd button { font-family: var(--mono); font-size: 10.5px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 4px; color: var(--muted); padding: 4px 10px; cursor: pointer; }
  .ck-cmd button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .ck-table { width: 100%; border-collapse: collapse; font-size: 12.5px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .ck-table th { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .ck-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .ck-table tr:last-child td { border-bottom: none; }
  .ceil { font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 3px; }
  .ceil.good { color: var(--ok); border: 1px solid var(--ok); }
  .ceil.mid { color: var(--accent); border: 1px solid var(--accent-dim); }
  .ceil.none { color: var(--bad); border: 1px solid var(--bad); }
  .ck-lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .ck-lane { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 9px; min-height: 60px; }
  .ck-lane h4 { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--dim); margin-bottom: 7px; }
  .playcard { background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
    padding: 8px 10px; margin-bottom: 6px; font-size: 12px; }
  .playcard.stalled { border-left: 3px solid var(--bad); }
  .playcard .nm { font-weight: 600; }
  .playcard .nx { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .ck-health { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .ck-health b { font-family: var(--mono); color: var(--text); }
  .ck-health .zero { color: var(--bad); }
  /* the crew: the engine's roles, visible */
  .crewgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .crewcard { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px; }
  .crewcard .chead { display: flex; gap: 9px; align-items: center; }
  .crewcard .glyph { font-size: 20px; line-height: 1; filter: grayscale(0.25); }
  .crewcard .cname { font-family: var(--serif); font-weight: 650; font-size: 13.5px; flex: 1; }
  .crewdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .crewdot.working { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .crewdot.today { background: var(--accent); }
  .crewdot.idle { background: var(--dim); }
  .crewdot.never { background: none; border: 1px solid var(--dim); }
  .crewcard .cduty { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .crewcard .cq { font-family: var(--mono); font-size: 10.5px; margin-top: 7px; }
  .crewcard .cq b { color: var(--accent); }
  .crewcard .cq.hot b { color: var(--bad); }
  .crewcard .cnote { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .crewcard .cbrief { font-family: var(--mono); font-size: 10px; color: var(--accent-dim); margin-top: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crewcard .cago { font-family: var(--mono); font-size: 10px; color: var(--dim); }
  /* grouped act-now: one card per kind, table rows inside */
  .ck-group table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  .ck-group td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
  .ck-group tr:last-child td { border-bottom: none; }
  .ck-group td.mono { font-family: var(--mono); font-size: 11px; white-space: nowrap; color: var(--muted); }
  .ck-group .minicopy { font-family: var(--mono); font-size: 10px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 3px; color: var(--muted); padding: 2px 7px; cursor: pointer; }
  .ck-group .minicopy:hover { color: var(--accent); border-color: var(--accent-dim); }
  .ck-strip { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; }
  .ck-strip b { font-family: var(--mono); color: var(--text); }
  /* play strip on prospect cards and dossiers */
  .playstrip { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 8px;
    padding: 7px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; font-size: 12px; }
  .playstrip .pstate { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 3px; padding: 1px 7px; }
  .playstrip.stalled .pstate { color: var(--bad); border-color: var(--bad); }
  .playstrip .pnext { color: var(--muted); flex: 1; min-width: 160px; }
  .playstrip .powner { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .dlchip { font-family: var(--mono); font-size: 10.5px; color: var(--warn, var(--accent));
    border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; white-space: nowrap; }
  /* quote disclosure */
  .citation details.qd summary { cursor: pointer; font-size: 11px; color: var(--dim);
    font-family: var(--mono); list-style: none; margin-top: 3px; }
  .citation details.qd summary::before { content: "▸ quote"; }
  .citation details.qd[open] summary::before { content: "▾ quote"; }
  .citation details.qd .quote { margin-top: 4px; }
  /* collapsed long sections */
  .showmore { font-family: var(--mono); font-size: 11px; color: var(--accent-dim); cursor: pointer;
    padding: 6px 0; display: inline-block; }
  .showmore:hover { color: var(--accent); }
  /* library mode switch */
  .modeswitch { display: flex; gap: 2px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px; margin-bottom: 12px; }
  .modeswitch div { flex: 1; text-align: center; font-family: var(--mono); font-size: 11px;
    padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--muted); }
  .modeswitch div.active { background: var(--panel); color: var(--accent); }
  /* responsive: never lose the navigation */
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  @media (max-width: 700px) {
    header { flex-wrap: wrap; }
    .searchbar { order: 3; width: 100%; }
  }
  /* ---- calendar ---- */
  #view-calendar.active { display: flex; }
  #view-calendar { gap: 0; min-height: 0; }
  .cal-main { flex: 1; overflow-y: auto; padding: 20px 24px; min-width: 0; }
  .cal-rail { width: 380px; flex-shrink: 0; border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 40px; background: var(--panel); }
  .cal-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .cal-head h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; }
  .cal-head .nav { display: flex; gap: 4px; margin-left: auto; }
  .cal-head .nav button { background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    border-radius: 4px; padding: 3px 10px; font-size: 13px; cursor: pointer; font-family: var(--mono); }
  .cal-head .nav button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .grid7 .dow { background: var(--panel); padding: 6px 8px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--dim); text-align: center; }
  .cell { background: var(--panel2); min-width: 0; min-height: 92px; padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; }
  .cell.out { opacity: .35; }
  .cell.today { background: var(--panel); box-shadow: inset 0 0 0 1px var(--accent-dim); }
  .cell .dnum { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .cell.today .dnum { color: var(--accent); font-weight: 700; }
  .ev-chip { font-size: 10.5px; line-height: 1.25; padding: 2px 5px; border-radius: 3px; cursor: pointer;
    border-left: 2px solid var(--accent); background: rgba(201,162,75,.10); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-chip.tender { border-left-color: var(--ok); background: rgba(95,174,114,.10); }
  .ev-chip.regulatory { border-left-color: var(--bad); background: rgba(209,106,90,.10); }
  .ev-chip.overdue { opacity: .6; text-decoration: line-through; }
  .ev-chip:hover { background: var(--panel); }
  .rail-sec { margin-bottom: 22px; }
  .rail-sec h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); margin-bottom: 9px; }
  .mile { padding: 9px 11px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
    margin-bottom: 7px; border-left: 3px solid var(--accent); }
  .mile.tender { border-left-color: var(--ok); }
  .mile.regulatory { border-left-color: var(--bad); }
  .mile.overdue { opacity: .65; }
  .mile .top { display: flex; gap: 8px; align-items: baseline; }
  .mile .days { font-family: var(--mono); font-size: 11px; color: var(--accent); white-space: nowrap; }

<script>
// ---- static build: key gate + in-memory API resolver ----
// The server API is replaced by a decrypted in-browser bundle. The fetch
// path strings stay identical so the UI code is unchanged.
window.__ARCHIVE__ = null;

function b64ToBytes(u8) { return u8; }

async function deriveKey(pass, salt) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function tryDecrypt(pass) {
  const buf = await (await fetch("data.enc")).arrayBuffer();
  const bytes = new Uint8Array(buf);
  const salt = bytes.slice(0, 16), iv = bytes.slice(16, 28), ct = bytes.slice(28);
  const key = await deriveKey(pass, salt);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}

function gateHtml() {
  return `<div id="gate" style="position:fixed;inset:0;background:#14120f;display:flex;align-items:center;justify-content:center;z-index:999">
    <form id="gateForm" style="background:#1c1915;border:1px solid #2e2a22;border-radius:8px;padding:32px 36px;width:340px;font:15px/1.5 -apple-system,system-ui,sans-serif;color:#e8e1d3">
      <h1 style="font-family:ui-serif,Georgia,serif;font-size:19px;margin:0 0 6px">research <em style="font-style:normal;color:#c9a24b">archive</em></h1>
      <p style="color:#a89c85;font-size:13px;margin:0 0 18px">Enter the access key. Data is encrypted; nothing renders without it.</p>
      <input id="gateKey" type="password" autocomplete="current-password" placeholder="access key" style="width:100%;box-sizing:border-box;background:#100e0b;border:1px solid #2e2a22;color:#e8e1d3;border-radius:5px;padding:10px 12px;font-size:14px">
      <button type="submit" style="margin-top:14px;width:100%;background:#c9a24b;color:#14120f;border:0;border-radius:5px;padding:10px;font-size:14px;font-weight:600;cursor:pointer">Decrypt</button>
      <div id="gateErr" style="color:#d16a5a;font-size:12.5px;margin-top:10px"></div>
    </form></div>`;
}

async function unlock(pass) {
  window.__ARCHIVE__ = await tryDecrypt(pass);
  sessionStorage.setItem("archive_pass", pass);
  const g = document.getElementById("gate");
  if (g) g.remove();
  loadMeta().then(() => { loadEntities(); loadCockpit(); });
}

window.addEventListener("DOMContentLoaded", async () => {
  document.body.insertAdjacentHTML("beforeend", gateHtml());
  document.getElementById("gateForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pass = document.getElementById("gateKey").value.trim();
    try { await unlock(pass); }
    catch (err) { document.getElementById("gateErr").textContent = "Wrong key (or corrupted download)."; }
  });
  const saved = sessionStorage.getItem("archive_pass");
  if (saved) { try { await unlock(saved); } catch (e) { sessionStorage.removeItem("archive_pass"); } }
  document.getElementById("gateKey").focus();
});

// In-memory implementations of the server endpoints, over the decrypted bundle.
function staticApi(path) {
  const A = window.__ARCHIVE__;
  if (!A) throw new Error("locked");
  const u = new URL(path, location.origin);
  const q = u.searchParams;
  const g = k => (q.get(k) || "").trim();
  const has = (arr, v) => (arr || []).includes(v);
  const sub = (s, needle) => (s || "").toLowerCase().includes(needle.toLowerCase());

  if (u.pathname === "/api/meta") return A.meta;
  if (u.pathname === "/api/questions") return A.questions;
  if (u.pathname === "/api/patterns") return A.patterns;
  if (u.pathname === "/api/calendar") return A.calendar;
  if (u.pathname === "/api/cockpit") return A.cockpit;
  if (u.pathname === "/api/crew") return A.crew;
  if (u.pathname.startsWith("/api/entity/")) {
    const d = A.entity_details[u.pathname.split("/").pop()];
    if (!d) throw new Error(404);
    return d;
  }
  if (u.pathname === "/api/entities") {
    const search = g("search"), type = g("type"), status = g("status"),
          country = g("country").toUpperCase(), vector = g("vector").toLowerCase();
    return A.entities.filter(e =>
      (!search || sub(e.name, search) || sub(e.summary, search) || sub((e.aliases_text || ""), search)) &&
      (!type || e.type === type) &&
      (!country || e.country === country) &&
      (!vector || has(e.vectors, vector)) &&
      (status ? e.status === status : e.status !== "merged"));
  }
  if (u.pathname === "/api/evidence") {
    const search = g("search"), gref = g("golden_ref"), stakes = g("stakes"),
          validOnly = g("valid_only") === "1",
          country = g("country").toUpperCase(), vector = g("vector").toLowerCase();
    return A.evidence.filter(e =>
      (!search || sub(e.claim, search) || sub(e.quote, search)) &&
      (!gref || has(e.golden_refs, parseInt(gref))) &&
      (!stakes || e.stakes === stakes) &&
      (!validOnly || !e.invalid_at) &&
      (!country || e.entity_country === country) &&
      (!vector || has(e.vectors, vector) || has(e.entity_vectors, vector))).slice(0, 500);
  }
  if (u.pathname === "/api/prospects") {
    const country = g("country").toUpperCase(), status = g("status");
    return A.prospects.filter(p =>
      (!country || p.country === country) && (!status || p.status === status));
  }
  throw new Error(404);
}
</script>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = { view: "entities", search: "", type: "", status: "", country: "", vector: "", selectedEntity: null, meta: null };
const fmtDkk = v => v >= 1e6 ? "~" + (v / 1e6).toFixed(1) + "M DKK/yr" : "~" + Math.round(v / 1e3) + "k DKK/yr";

function fmtDate(d) { return d ? d.slice(0, 10) : ""; }

async function api(path) {
  return staticApi(path);
}

async function loadMeta() {
  const m = await api("/api/meta");
  state.meta = m;
  $("totals").innerHTML =
    `<span><b class="num">${m.totals.entities}</b> entities</span>` +
    `<span><b class="num">${m.totals.evidence}</b> claims</span>` +
    `<span><b class="num">${m.totals.prospects}</b> prospects</span>`;
  document.title = `research archive · ${m.domain}`;
  const facet = (elId, items, key, allLabel, total, stateKey) => {
    $(elId).innerHTML = `<div class="fitem active" data-v="">${allLabel}<span class="n">${total}</span></div>` +
      items.map(t => `<div class="fitem" data-v="${esc(t[key])}">${esc(t[key])}<span class="n">${t.n}</span></div>`).join("");
    $(elId).querySelectorAll(".fitem").forEach(el => el.addEventListener("click", () => {
      state[stateKey] = el.dataset.v;
      $(elId).querySelectorAll(".fitem").forEach(x => x.classList.toggle("active", x === el));
      loadEntities();
    }));
  };
  facet("typeFacets", m.types, "type", "All types", m.totals.entities, "type");
  facet("countryFacets", m.countries, "country", "Anywhere", m.totals.entities, "country");
  facet("vectorFacets", m.vectors, "vector", "All vectors", m.totals.entities, "vector");
  $("statusFacets").querySelectorAll(".fitem").forEach(el => el.addEventListener("click", () => {
    state.status = el.dataset.status;
    $("statusFacets").querySelectorAll(".fitem").forEach(x => x.classList.toggle("active", x === el));
    loadEntities();
  }));
  // Populate toolbar selects once
  [["prCountry", m.countries, "country"], ["evCountry", m.countries, "country"], ["evVector", m.vectors, "vector"]]
    .forEach(([id, items, key]) => {
      const sel = $(id);
      if (sel.options.length > 1) return;
      items.forEach(t => {
        const o = document.createElement("option");
        o.value = t[key]; o.textContent = `${t[key]} (${t.n})`;
        sel.appendChild(o);
      });
    });
}

function entityRowHtml(e) {
  const cls = e.status === "stub" ? '<span class="badge stub">stub</span>' : "";
  const cc = e.country ? `<span class="badge">${esc(e.country)}</span>` : "";
  const vecs = (e.vectors || []).map(v => `<span class="vchip">${esc(v)}</span>`).join("");
  return `<div class="erow${state.selectedEntity === e.id ? " active" : ""}" data-id="${e.id}">
    <div class="nm">${esc(e.name)}</div>
    <div class="meta"><span class="badge type-${esc(e.type)}">${esc(e.type)}</span>${cc}${cls}
      <span>${e.evidence_n} claim${e.evidence_n === 1 ? "" : "s"}</span>
      ${e.edge_n ? `<span>· ${e.edge_n} link${e.edge_n === 1 ? "" : "s"}</span>` : ""}
      ${vecs}
    </div>
  </div>`;
}

async function loadEntities() {
  const q = new URLSearchParams({ search: state.search, type: state.type, status: state.status,
                                  country: state.country, vector: state.vector });
  const list = await api("/api/entities?" + q);
  $("entityList").innerHTML = list.length ? list.map(entityRowHtml).join("")
    : `<div class="empty">No entities match.</div>`;
  $("entityList").querySelectorAll(".erow").forEach(el =>
    el.addEventListener("click", () => selectEntity(parseInt(el.dataset.id))));
  if (state.selectedEntity && !list.find(e => e.id === state.selectedEntity)) {
    state.selectedEntity = null;
    $("detail").style.display = "none";
    $("detailEmpty").style.display = "flex";
  }
}

function citationHtml(e, showEntity) {
  const chips = [];
  if (e.stakes === "high") chips.push(`<span class="chip">high-stakes</span>`);
  if (e.invalid_at) chips.push(`<span class="chip invalidated">invalidated</span>`);
  if (e.needs_reverify) chips.push(`<span class="chip stale">needs re-verify</span>`);
  const val = (e.value_num != null) ? ` <span class="val">${e.value_num}${e.unit ? " " + esc(e.unit) : ""}</span>` : "";
  return `<div class="citation${e.invalid_at ? " invalid" : ""}${e.stakes === "high" ? " high" : ""}">
    ${showEntity ? `<div class="src-entity">${esc(e.entity_name || "—")}</div>` : ""}
    <div class="claim">${esc(e.claim)}${val}</div>
    ${e.quote ? `<details class="qd"><summary></summary><div class="quote">"${esc(e.quote)}"</div></details>` : ""}
    <div class="footline">
      <span>${fmtDate(e.retrieved_at)}</span>
      ${e.source_host ? `<span class="sep">·</span><a href="${esc(e.source_url)}" target="_blank" rel="noopener">${esc(e.source_host)}</a>` : ""}
      ${chips.length ? `<span class="sep">·</span>${chips.join(" ")}` : ""}
    </div>
  </div>`;
}

async function selectEntity(id) {
  state.selectedEntity = id;
  $("entityList").querySelectorAll(".erow").forEach(el => el.classList.toggle("active", parseInt(el.dataset.id) === id));
  const d = await api("/api/entity/" + id);
  $("detailEmpty").style.display = "none";
  const det = $("detail");
  det.style.display = "block";
  const aliases = (d.aliases || []).filter(a => a !== d.name);
  det.innerHTML = `
    <div class="dhead">
      <div class="kicker"><span class="badge type-${esc(d.type)}">${esc(d.type)}</span>${d.country ? `<span class="badge">${esc(d.country)}</span>` : ""}${d.classification ? `<span>${esc(d.classification)}</span>` : ""}${(d.vectors || []).map(v => `<span class="vchip">${esc(v)}</span>`).join("")}${d.status === "stub" ? '<span class="badge stub">stub</span>' : ""}</div>
      <h2>${esc(d.name)}</h2>
      ${aliases.length ? `<div class="aliases">also known as ${aliases.map(esc).join(", ")}</div>` : ""}
      ${d.summary ? `<div class="summary">${esc(d.summary)}</div>` : ""}
      <div class="idline">#${d.id}${d.registry_id ? ` · ${esc(d.registry_id)}` : ""}</div>
      ${d.play ? `<div class="playstrip${(!d.play.next_date || d.play.next_date < new Date().toISOString().slice(0,10)) ? " stalled" : ""}">
        <span class="pstate">play: ${esc(d.play.state)}</span>
        <span class="pnext">${esc(d.play.next_action || "no next action set")}${d.play.next_date ? " by " + esc(d.play.next_date) : ""}</span>
        <span class="powner">${esc(d.play.owner || "unowned")}</span>
      </div>` : ""}
      ${(d.milestones || []).length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        ${d.milestones.map(m => `<span class="dlchip">${esc(m.due_date || "watch")} · ${esc(m.label.slice(0, 40))}${m.amount_dkk ? " · " + fmtAmt(m.amount_dkk) : ""}</span>`).join("")}
      </div>` : ""}
    </div>
    ${d.prospect ? `<div class="dsection">
      <h3>Prospect assessment</h3>
      <div class="prcard ${esc(d.prospect.status)}${d.prospect.needs_rescore ? " rescore" : ""}" style="cursor:default">
        <div class="prhead"><span class="st ${esc(d.prospect.status)}">${esc(d.prospect.status)}</span>
          ${d.prospect.needs_rescore ? '<span class="st">needs rescore</span>' : ""}
          ${d.prospect.money_dkk ? `<span class="money">${fmtDkk(d.prospect.money_dkk)}</span>` : ""}</div>
        <div class="meters">
          <div class="meter">interest <span class="bar"><i style="width:${Math.round(100 * (d.prospect.interest || 0))}%"></i></span><span class="v">${(d.prospect.interest || 0).toFixed(2)}</span></div>
          <div class="meter">money <span class="bar"><i style="width:${Math.round(100 * (d.prospect.money || 0))}%"></i></span><span class="v">${(d.prospect.money || 0).toFixed(2)}</span></div>
        </div>

let calMonth = null;  // Date anchored to the 1st of the displayed month
let calData = null;

function daysUntil(iso) {
  const d = new Date(iso + "T00:00:00");
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
function fmtAmt(v) {
  if (!v) return "";
  return v >= 1e6 ? (v/1e6).toFixed(1) + "M" : Math.round(v/1e3) + "k";
}

async function loadCalendar() {
  calData = await api("/api/calendar");
  if (!calMonth) { const n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  renderCalendar();
}

function renderCalendar() {
  const dated = calData.filter(m => m.due_date);
  const triggers = calData.filter(m => !m.due_date);
  const overdue = dated.filter(m => daysUntil(m.due_date) < 0);
  const soon = dated.filter(m => { const d = daysUntil(m.due_date); return d >= 0 && d <= 45; })
                    .sort((a,b) => ((b.urgency||0) - (a.urgency||0)) || a.due_date.localeCompare(b.due_date));
  const inPlay = soon.reduce((s,m) => s + (m.amount_dkk || 0), 0);
  const actNow = soon.filter(m => (m.urgency||0) === 3);

  // month grid
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const first = new Date(y, mo, 1);
  const startDow = (first.getDay() + 6) % 7;           // Monday-first
  const daysIn = new Date(y, mo + 1, 0).getDate();
  const prevDays = new Date(y, mo, 0).getDate();
  const todayIso = new Date().toISOString().slice(0,10);
  const byDay = {};
  dated.forEach(m => { (byDay[m.due_date] = byDay[m.due_date] || []).push(m); });

  let cells = "";
  for (let i = 0; i < 42; i++) {
    let dnum, iso, out = false;
    if (i < startDow) { dnum = prevDays - startDow + 1 + i; const d = new Date(y, mo-1, dnum); iso = isoOf(d); out = true; }
    else if (i - startDow < daysIn) { dnum = i - startDow + 1; iso = isoOf(new Date(y, mo, dnum)); }
    else { dnum = i - startDow - daysIn + 1; iso = isoOf(new Date(y, mo+1, dnum)); out = true; }
    const evs = (byDay[iso] || []).map(m => {
      const od = daysUntil(m.due_date) < 0 ? " overdue" : "";
      const ug = m.urgency ? " urg-" + m.urgency : "";
      const bang = (!od && m.urgency >= 2) ? "!".repeat(m.urgency) + " " : "";
      return `<div class="ev-chip ${esc(m.category||"")}${od}${ug}" data-ref="${esc(m.ref||"")}" title="${esc(m.label)}">${bang}${esc(m.label)}</div>`;
    }).join("");
    cells += `<div class="cell${out?" out":""}${iso===todayIso?" today":""}"><span class="dnum">${dnum}</span>${evs}</div>`;
  }
  const dows = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("");
  const monthName = calMonth.toLocaleString("en", {month:"long", year:"numeric"});

  const mileHtml = m => {
    const d = daysUntil(m.due_date);
    const od = d < 0;
    const ug = m.urgency || 0;
    const who = (m.contacts||[]).map(c => `<b>${esc(c.name)}</b>${c.reach?" · "+esc(c.reach):""}`).join(", ");
    return `<div class="mile ${esc(m.category||"")}${od?" overdue":""}${ug?" urg-"+ug:""}" data-ref="${esc(m.ref||"")}"${m.entity_id?` data-entity="${m.entity_id}" style="cursor:pointer" title="open ${esc(m.entity_name||"the linked organization")}"`:""}>
      <div class="top">${ug?`<span class="urg urg-${ug}" title="urgency ${ug} of 3">${"!".repeat(ug)}</span>`:""}
        <span class="days">${od?d+"d":"+"+d+"d"}</span>
        <span class="lbl">${esc(m.label)}</span>
        ${m.amount_dkk?`<span class="amt">${fmtAmt(m.amount_dkk)}</span>`:""}</div>
      ${m.owner?"":`<div class="who">unowned — <b>give it an owner</b></div>`}
      ${m.action?`<div class="act">${esc(m.action)}</div>`:""}
      ${who?`<div class="who">${who}</div>`:""}
      ${m.source_url?`<div class="who"><a href="${esc(m.source_url)}" target="_blank" rel="noopener">source</a></div>`:""}
    </div>`;
  };

  $("view-calendar").innerHTML = `
    <div class="cal-main">
      <div class="cal-head">
        <h2>${monthName}</h2>
        <div class="nav">
          <button data-nav="-1">←</button><button data-nav="0">today</button><button data-nav="1">→</button>
        </div>
      </div>
      <div class="sumbar">
        ${actNow.length?`<span class="warn"><span class="urg urg-3">!!!</span> <b>${actNow.length}</b> need action this week</span>`:""}
        <span><b>${soon.length}</b> due in 45 days</span>
        <span><b>${fmtAmt(inPlay)} DKK</b> in play</span>
        ${overdue.length?`<span class="warn"><b>${overdue.length}</b> overdue — close or reschedule</span>`:""}
        <span><b>${triggers.length}</b> watch triggers</span>
      </div>
      <div class="grid7">${dows}${cells}</div>
    </div>
    <div class="cal-rail">
      <div class="rail-sec"><h3>Next 45 days</h3>
        ${soon.length?soon.map(mileHtml).join(""):'<div class="empty">Nothing due.</div>'}</div>
      ${overdue.length?`<div class="rail-sec"><h3>Overdue (${overdue.length})</h3>${overdue.map(mileHtml).join("")}</div>`:""}
      ${triggers.length?`<div class="rail-sec"><h3>Watch triggers (undated)</h3>${triggers.map(m=>`
        <div class="mile ${esc(m.category||"")}"><div class="top"><span class="lbl">${esc(m.label)}</span></div>
        ${m.action?`<div class="act">${esc(m.action)}</div>`:""}</div>`).join("")}</div>`:""}
    </div>`;

  $("view-calendar").querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
    const n = parseInt(b.dataset.nav);
    if (n === 0) { const x = new Date(); calMonth = new Date(x.getFullYear(), x.getMonth(), 1); }
    else calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1);
    renderCalendar();
  }));
  // Grid chip -> its rail card (scroll + flash); rail card -> the linked
  // organization's dossier when one exists.
  $("view-calendar").querySelectorAll(".ev-chip[data-ref]").forEach(ch => ch.addEventListener("click", () => {
    const card = $("view-calendar").querySelector(`.mile[data-ref="${CSS.escape(ch.dataset.ref)}"]`);
    if (card) {
      card.scrollIntoView({behavior: "smooth", block: "center"});
      card.classList.add("flash");
      setTimeout(() => card.classList.remove("flash"), 1600);
    } else {
      const m = calData.find(x => x.ref === ch.dataset.ref);
      if (m && m.entity_id) goToEntity(m.entity_id);
    }
  }));
  $("view-calendar").querySelectorAll(".mile[data-entity]").forEach(el =>
    el.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      goToEntity(parseInt(el.dataset.entity));
    }));
}

function goToEntity(id) {
  document.querySelector('.tab[data-view="entities"]').click();
  setLibMode("entities");
  selectEntity(id);
}
function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

async function loadCockpit() {
  const c = await api("/api/cockpit");
  const copyBtn = cmd => cmd ? `<div class="ck-cmd"><code>${esc(cmd)}</code><button data-cmd="${esc(cmd)}">copy</button></div>` : "";
  // Group repetitive kinds into one card with table rows: nine overdue
  // funding cards were 1,700px of the same shape; a grouped table is ~300.
  const byKind = {};
  c.act_now.forEach(a => (byKind[a.kind] = byKind[a.kind] || []).push(a));
  const groupCard = (items, title) => {
    const maxU = Math.max(...items.map(a => a.urgency));
    const dkk = items.reduce((s, a) => s + (a.amount_dkk || 0), 0);
    return `<div class="ck-card ck-group u${maxU}">
      <div class="row1"><span class="urg urg-${maxU}">${"!".repeat(maxU)}</span>
        <span class="lbl">${items.length} ${esc(title)}</span>
        ${dkk ? `<span class="mono">${fmtAmt(dkk)} DKK</span>` : ""}</div>
      <table>${items.map(a => `<tr title="${esc(a.detail || "")}">
        <td class="mono">${a.days !== null && a.days !== undefined ? (a.days < 0 ? a.days + "d" : "+" + a.days + "d") : ""}</td>
        <td>${esc(a.label)}</td>
        <td class="mono">${a.amount_dkk ? fmtAmt(a.amount_dkk) : ""}</td>
        <td>${a.cmd ? `<button class="minicopy" data-cmd="${esc(a.cmd)}">copy</button>` : ""}</td>
      </tr>`).join("")}</table>
    </div>`;
  };
  const singleCard = a => `
    <div class="ck-card u${a.urgency}">
      <div class="row1">
        <span class="urg urg-${a.urgency}">${"!".repeat(a.urgency)}</span>
        <span class="kind">${esc(a.kind)}</span>
        <span class="lbl">${esc(a.label)}</span>
        ${a.days !== null && a.days !== undefined ? `<span class="mono">${a.days < 0 ? a.days + "d" : "+" + a.days + "d"}</span>` : ""}
        ${a.amount_dkk ? `<span class="mono">${fmtAmt(a.amount_dkk)} DKK</span>` : ""}
        ${a.owner ? `<span class="mono">${esc(a.owner)}</span>` : ""}
      </div>
      ${a.detail ? `<div class="det">${esc(a.detail)}</div>` : ""}
      ${copyBtn(a.cmd)}
    </div>`;
  const KIND_TITLES = {"milestone": "dated items needing action", "suspect-decision": "suspect decisions",
                       "challenge": "challenged rows to adjudicate"};
  const actHtml = c.act_now.length ? Object.entries(byKind).map(([k, items]) =>
    (items.length > 2 && KIND_TITLES[k]) ? groupCard(items, KIND_TITLES[k])
      : items.map(singleCard).join("")).join("")
    : `<div class="empty">Nothing demands action right now.</div>`;

  const ceil = v => {
    if (!c.capability_included) return `<span class="mono">local only</span>`;
    const m = v.ceiling;
    if (!m) return `<span class="ceil none">none</span>`;
    if (m === "refuted-only") return `<span class="ceil none">refuted only</span>`;
    const cls = (m === "demonstrated-once" || m === "hypothesized") ? "mid" : "good";
    return `<span class="ceil ${cls}">${esc(m)}</span>`;
  };
  const regimeRows = v => (v.regimes || []).map(r => `<tr>
      <td style="padding-left:22px;color:var(--muted)">↳ ${esc(r.slug.replace(v.vector + "-", ""))}</td>
      <td>${r.entities}</td><td>${r.evidence}</td><td></td><td></td>
      <td>${!c.capability_included ? `<span class="mono">local only</span>` : (r.ceiling ? `<span class="ceil ${(r.ceiling === "demonstrated-once" || r.ceiling === "hypothesized") ? "mid" : "good"}">${esc(r.ceiling)}</span>` : `<span class="ceil none">none</span>`)}</td><td></td>
    </tr>`).join("") + (v.untagged ? `<tr><td style="padding-left:22px;color:var(--dim)" colspan="7">↳ ${v.untagged} ${esc(v.vector)} rows untagged by regime — the retag backlog</td></tr>` : "");
  const matrixHtml = `<table class="ck-table"><tr><th>vector</th><th>entities</th><th>evidence</th>
    <th>warm+hot</th><th>pipeline DKK</th><th>capability ceiling</th><th>refuted</th></tr>
    ${c.matrix.map(v => `<tr><td><b>${esc(v.vector)}</b></td><td>${v.entities}</td><td>${v.evidence}</td>
      <td>${v.warm_hot || 0}</td><td>${v.money_dkk ? fmtAmt(v.money_dkk) : "—"}</td>
      <td>${ceil(v)}</td><td>${(v.capability && v.capability.refuted) || ""}</td></tr>${regimeRows(v)}`).join("")}</table>`;

  // Plays: a summary strip plus exceptions only. Twenty identical stalled
  // cards taught nothing; the strip says the state, the cards show what
  // actually needs a decision (dated-and-overdue, or recently moved).
  const LANES = ["identified", "prepared", "contacted", "in-conversation", "parked"];
  const playCard = p => `<div class="playcard${p.stalled ? " stalled" : ""}">
      <div class="nm">${esc(p.name)}</div>
      <div class="nx">${p.stalled ? "<b>STALLED</b> — " : ""}${esc(p.next_action || "no next action")}${p.next_date ? " by " + esc(p.next_date) : ""} · ${esc(p.owner || "unowned")}</div>
    </div>`;
  const counts = LANES.map(l => [l, c.plays.filter(p => p.state === l).length]).filter(([, n]) => n);
  const noDate = c.plays.filter(p => !p.next_date).length;
  const overduePlays = c.plays.filter(p => p.next_date && p.stalled);
  const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
  const moved = c.plays.filter(p => p.updated_at > weekAgo && !p.stalled);
  const stripHtml = `<div class="ck-strip">
      ${counts.map(([l, n]) => `<span>${l} <b>${n}</b></span>`).join("")}
      ${noDate ? `<span class="urg urg-2">!!</span><span><b>${noDate}</b> without a next action — set them (<code style="font-size:10px">db.py play advance &lt;id&gt; --state ... --next ... --by ...</code>)</span>` : ""}
    </div>`;
  const exceptions = overduePlays.slice(0, 6).map(playCard).join("") + moved.slice(0, 4).map(playCard).join("");
  const populated = counts.length;
  const lanesHtml = stripHtml + (exceptions ? exceptions :
    (populated > 1 ? `<div class="ck-lanes">${LANES.map(l => { const ps = c.plays.filter(p => p.state === l); return ps.length ? `<div class="ck-lane"><h4>${l} (${ps.length})</h4>${ps.map(playCard).join("")}</div>` : ""; }).join("")}</div>` : ""));

  const cc = c.claim_ceiling;
  const ccHtml = cc ? `<div class="ck-health" style="margin-bottom:8px">
      ${Object.entries(cc.histogram).map(([k, v]) => `<span>${esc(k)}: <b>${v}</b></span>`).join("")}</div>
    ${cc.refuted.length ? `<div class="det" style="font-size:12px;color:var(--bad)">never claim: ${cc.refuted.map(esc).join(" · ")}</div>` : ""}`
    : `<div class="empty" style="padding:12px">capability data is local-only (not in the published archive)</div>`;

  const h = c.health;
  const healthHtml = `<div class="ck-health">
      <span>valid evidence <b>${h.valid_evidence}</b></span>
      <span>needs reverify <b>${h.needs_reverify}</b></span>
      <span>last eval <b>${h.last_eval ? Number(h.last_eval.overall).toFixed(2) : "—"}</b></span>
      <span>outside-agent reads, 7d <b class="${h.outside_reads_7d ? "" : "zero"}">${h.outside_reads_7d}</b></span>
      <span>rows staged via MCP <b class="${h.mcp_staged_total ? "" : "zero"}">${h.mcp_staged_total}</b></span>
    </div>`;

  const crew = await api("/api/crew");
  const ago = ts => {
    if (!ts) return "never ran";
    const d = (Date.now() - new Date(ts).getTime()) / 36e5;
    return d < 1 ? Math.round(d * 60) + "m ago" : d < 48 ? Math.round(d) + "h ago" : Math.round(d / 24) + "d ago";
  };
  const crewHtml = `<div class="crewgrid">${crew.map(r => `
    <div class="crewcard">
      <div class="chead"><span class="glyph">${r.glyph}</span>
        <span class="cname">${esc(r.label)}</span>
        <span class="cago">${ago(r.last_ts)}</span>
        <span class="crewdot ${esc(r.status)}" title="${esc(r.status)}"></span></div>
      <div class="cduty">${esc(r.duty)} · ${r.actions_total} action${r.actions_total === 1 ? "" : "s"} logged</div>
      ${r.queue ? `<div class="cq${r.queue > 50 ? " hot" : ""}">queue: <b>${r.queue}</b> waiting</div>` : ""}
      ${r.last_note ? `<div class="cnote">${esc(r.last_note)}</div>` : ""}
      ${r.brief ? `<div class="cbrief" title="${esc(r.brief.line)}">${esc(r.brief.file)}</div>` : ""}
    </div>`).join("")}</div>`;

  $("view-cockpit").innerHTML = `
    <div class="ck-band"><h2>Act now<span class="n">${c.act_now.length}</span></h2>${actHtml}</div>
    <div class="ck-band"><h2>Sellable-now matrix<span class="n">market heat × capability ceiling</span></h2>${matrixHtml}</div>
    <div class="ck-band"><h2>Plays<span class="n">${c.plays.length} open</span></h2>${lanesHtml}</div>
    <div class="ck-band"><h2>The crew<span class="n">who worked, what they left, what waits</span></h2>${crewHtml}</div>
    ${(c.cleanup && c.cleanup.length) ? `<div class="ck-band"><h2>Cleanup<span class="n">deadlines that passed unclosed — close or roll them, no drama</span></h2>
      <details><summary class="showmore">${c.cleanup.length} unclosed past-due item(s) · ${fmtAmt(c.cleanup.reduce((s, a) => s + (a.amount_dkk || 0), 0))} DKK ▾</summary>
      <div class="ck-card ck-group"><table>${c.cleanup.map(a => `<tr title="${esc(a.detail || "")}">
        <td class="mono">${a.days}d</td><td>${esc(a.label)}</td>
        <td class="mono">${a.amount_dkk ? fmtAmt(a.amount_dkk) : ""}</td>
        <td><button class="minicopy" data-cmd="${esc(a.cmd)}">copy</button></td>
      </tr>`).join("")}</table></div></details></div>` : ""}
    <div class="ck-band"><h2>Claim ceiling</h2>${ccHtml}</div>
    <div class="ck-band"><h2>Health</h2>${healthHtml}</div>
    <div class="ck-band"><h2>Patterns</h2>
      <details id="ckPatternsD"><summary class="showmore">open the patterns boards ▾</summary><div id="ckPatterns"></div></details></div>`;
  $("ckPatternsD").addEventListener("toggle", () => {
    if ($("ckPatternsD").open && !$("ckPatterns").innerHTML) loadPatterns("ckPatterns");
  });
  $("view-cockpit").querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.cmd); b.textContent = "copied"; }
    catch (e) { const t = document.createElement("textarea"); t.value = b.dataset.cmd;
      document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); b.textContent = "copied"; }
    setTimeout(() => { b.textContent = "copy"; }, 1500);
  }));
}

// Library is one tab with two modes (Organizations | Claims): both mode
// switches (one per facet column) stay in sync, and the Claims mode swaps
// the active view without leaving the tab.
let libMode = "entities";
function setLibMode(m) {
  libMode = m;
  document.querySelectorAll(".modeswitch div").forEach(d =>
    d.classList.toggle("active", d.dataset.mode === m));
  $("view-entities").classList.toggle("active", m === "entities");
  $("view-evidence").classList.toggle("active", m === "evidence");
  if (m === "evidence") loadEvidence(); else loadEntities();
}
document.querySelectorAll(".modeswitch div").forEach(d =>
  d.addEventListener("click", () => setLibMode(d.dataset.mode)));

function openEvidenceForQuestion(num) {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x.dataset.view === "entities"));
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  state.view = "entities";
  const sel = $("evQuestion");
  if (sel) sel.value = String(num);
  setLibMode("evidence");
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + t.dataset.view));
  state.view = t.dataset.view;
  if (state.view === "cockpit") loadCockpit();
  if (state.view === "entities") setLibMode(libMode);
  if (state.view === "questions") loadQuestions();
  if (state.view === "prospects") loadProspects();
  if (state.view === "calendar") loadCalendar();
}));

let searchTimer;
$("search").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    if (state.view === "entities") loadEntities();
    else if (state.view === "evidence") loadEvidence();
  }, 220);
});
["evQuestion", "evStakes", "evValidOnly", "evCountry", "evVector"].forEach(id =>
  $(id).addEventListener("change", loadEvidence));
["prCountry", "prStatus"].forEach(id => $(id).addEventListener("change", loadProspects));

// Keyboard: "/" focuses search, Esc clears it (or closes the entity
// detail), 1-5 switch tabs. A daily two-person tool earns its shortcuts.
document.addEventListener("keydown", e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("search").focus(); return; }
  if (e.key === "Escape") {
    if (typing) { document.activeElement.blur(); return; }
    if ($("search").value) { $("search").value = ""; $("search").dispatchEvent(new Event("input", {bubbles: true})); return; }
    if (state.selectedEntity) { state.selectedEntity = null; $("detail").style.display = "none"; $("detailEmpty").style.display = "flex"; }
    return;
  }
  if (!typing && e.key >= "1" && e.key <= "5") {
    const tabs = [...document.querySelectorAll(".tab")];
    const t = tabs[parseInt(e.key) - 1];
    if (t) t.click();
  }
});

/* boot happens after decrypt (static build) */
</script>
